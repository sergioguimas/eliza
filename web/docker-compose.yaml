version: '3.8'

services:
  elisa-app:
    container_name: elisa-app
    build: .
    restart: always
    networks:
      proxy_net: {} # Mantém IP automático nesta rede
      evo_net:
        ipv4_address: ${IP_EVO_NET} # Fixa o IP na evo_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elisa-app.rule=Host(`${DNS}`)"
      - "traefik.http.services.elisa-app.loadbalancer.server.port=3000"
    env_file:
      - .env
    volumes:
      - /opt/stacks/solasoftware/sola-media:/data/media
    environment:
      MEDIA_DIR: /data/media
  eliza-media:
    container_name: eliza-media
    image: nginx:1.27-alpine
    restart: always
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - /opt/stacks/solasoftware/sola-media:/srv/media:ro
      - ./infra/media-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      proxy_net: {}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eliza-media.rule=Host(`${DNS}`) && PathPrefix(`/media/`)"
      - "traefik.http.routers.eliza-media.priority=100"
      - "traefik.http.services.eliza-media.loadbalancer.server.port=80"
networks:
  proxy_net:
    external: true
  evo_net:
    external: true
